<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Profile - CV. Triloka Sejahtera</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="logo">CV. TRILOKA SEJAHTERA</div>
    <nav class="nav-links">
      <a href="#">Payment</a>
      <a href="#" class="active">My Profile</a>
      <a href="#">Notification</a>
      <a href="#">Document Verification</a>
      <button class="sign-out">Sign Out</button>
    </nav>
  </header>

  <main>
    <div class="profile-container">
      <div class="profile-left">
        <img id="profilePic" src="https://via.placeholder.com/120" alt="Profile Picture">
        <input type="file" id="uploadPic" accept="image/*" style="display:none;">
        <button onclick="document.getElementById('uploadPic').click()">Ubah Foto</button>
      </div>

      <div class="profile-right">
        <h2>Informasi Profil</h2>

        <div class="form-group">
          <label for="nama">Nama Lengkap</label>
          <input type="text" id="nama" value="Ujang Sarden">
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" value="ujangsarden@example.com">
        </div>

        <div class="form-group">
          <label for="telepon">No. Telepon</label>
          <input type="text" id="telepon" value="081234567890">
        </div>

        <div class="form-group">
          <label for="alamat">Alamat</label>
          <input type="text" id="alamat" value="Jalan Indah, Sulawesi Tengah">
        </div>

        <button class="save-btn" onclick="simpanProfil()">Simpan Perubahan</button>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
