<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Profile - CV. Triloka Sejahtera</title>
    <link rel="stylesheet" href="style_profile.css">
</head>

<body>

    <header>
        <div class="logo">CV. TRILOKA SEJAHTERA</div>
        <nav class="nav-links">
            <a href="#">Payment</a>
            <a href="#" class="active">My Profile</a>
            <a href="#">Notification</a>
            <a href="#">Document Verification</a>
            <button class="sign-out">Sign Out</button>
        </nav>
    </header>

    <div class="banner"></div>

    <div class="profile-container">
        <div class="profile-photo-section">
            <img id="profilePreview" src="https://i.pravatar.cc/120" alt="Profile Photo">
            <input type="file" id="profileInput" accept="image/*" hidden>
            <button class="btn-change-photo" id="changePhotoBtn">Ubah Foto</button>
        </div>

        <h3 class="username">YudzJaw009</h3>

        <div class="form-row">
            <div class="form-group" style="flex:1">
                <label>First Name</label>
                <input type="text" value="Kilan">
            </div>
            <div class="form-group" style="flex:1">
                <label>Last Name</label>
                <input type="text" value="James">
            </div>
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" value="kilanjames@gmail.com">
        </div>

        <div class="form-group">
            <label>No HP</label>
            <input type="text" value="00000000">
        </div>

        <div class="button-row">
            <button class="btn btn-save" id="saveBtn">Save</button>
            <button class="btn btn-logout">Logout</button>

        </div>

    </div>

    <div class="modal" id="successModal">
        <div class="modal-content">
            <img src="https://cdn-icons-png.flaticon.com/512/845/845646.png" alt="Check">
            <h2>Berhasil</h2>
            <button class="btn-dashboard" onclick="closeModal()">Kembali ke Dashboard</button>
        </div>
    </div>

    <script src="script_profile.js"></script>
</body>

</html>
